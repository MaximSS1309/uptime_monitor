services:
  postgres:
    image: postgres:16
    container_name: site_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_pass
      POSTGRES_DB: site_monitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d site_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: site_monitor_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://monitor_user:monitor_pass@postgres:5432/site_monitor
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: